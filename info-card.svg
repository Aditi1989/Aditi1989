                </text>

            </g>
            

            <g class="line"
               style="animation-delay:0.84s">

                <text x="125"
                      y="308"
                      class="value"
                      fill="#c9d1d9">
                    Customer Feedback System
                </text>

            </g>
            

            <g class="line"
               style="animation-delay:0.96s">

                <text x="125"
                      y="336"
                      class="value"
